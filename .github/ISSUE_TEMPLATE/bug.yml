name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version de PichetMeter
      description: Onglet Infos ou Paramètres > Diagnostic
      placeholder: "1.4.0"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module concerné
      options: [DPS meter, Armurerie / classement, Timers, Cooldowns, Viseur, Carte, Ping, Installation, Autre]
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Ce que tu as fait, ce que tu attendais, ce qui s'est passé. Les captures d'écran aident beaucoup.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic et journal
      description: Paramètres > Diagnostic (capture), et si possible les dernières lignes de %APPDATA%\PichetMeter\journal.txt. Retire tout ce que tu ne veux pas rendre public.
  - type: input
    id: windows
    attributes:
      label: Windows et mode d'affichage du jeu
      placeholder: "Windows 11, plein écran fenêtré"
