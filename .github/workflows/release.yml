name: Publication

# Crée la release de la version indiquée dans app/package.json (tag vX.Y.Z + zip d'installation)
# dès qu'elle arrive sur main, si elle n'existe pas encore. Pousser un tag vX.Y.Z fonctionne aussi.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version à publier
        id: version
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $v de app/package.json"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "La release v$v existe déjà : rien à publier."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests Node
        if: steps.version.outputs.publier == 'oui'
        run: for t in test/*.test.js; do node "$t"; done
      - name: Scripts PowerShell
        if: steps.version.outputs.publier == 'oui'
        shell: pwsh
        run: ./tools/pscheck.ps1 -Files ((Get-ChildItem app/*.ps1, setup/fichiers/*.ps1).FullName)
      - name: Paquet d'installation
        if: steps.version.outputs.publier == 'oui'
        run: |
          python3 tools/build.py
          cp "dist/PichetMeter-$VERSION-Installation.zip" dist/PichetMeter-Installation.zip
          python3 tools/notes.py "$VERSION" > dist/notes.md
      - name: Release GitHub
        if: steps.version.outputs.publier == 'oui'
        run: |
          gh release create "v$VERSION" "dist/PichetMeter-$VERSION-Installation.zip" dist/PichetMeter-Installation.zip \
            --target "$GITHUB_SHA" --title "PichetMeter $VERSION" --notes-file dist/notes.md --latest
